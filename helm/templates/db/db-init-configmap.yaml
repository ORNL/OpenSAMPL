apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opensampl.fullname" . }}-db-init
  labels:
    {{- include "opensampl.labels" . | nindent 4 }}
data:
  020_create_grafana_user.sh: |
    #!/bin/bash
    set -e

    # Create the read-only role Grafana connects as. The migrations grant privileges to this role,
    # so it must exist before they run. Mirrors opensampl/server/db/create-grafana.sh.
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE grafana WITH LOGIN PASSWORD '${GF_SECURITY_ADMIN_PASSWORD}';
    EOSQL
