{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opensampl.fullname" . }}-migrations
  labels:
    {{- include "opensampl.labels" . | nindent 4 }}
    role: migrations
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.busybox.image.repository }}:{{ .Values.busybox.image.tag }}"
          command:
            - sh
            - -c
            - >
              until nc -z {{ include "opensampl.fullname" . }}-db {{ .Values.db.port }};
              do echo "Waiting for DB...";
              sleep 3;
              done;
      containers:
      - name: migrations
        image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
          # the migrations image (alembic env.py) reads DB_URI
          - name: DB_URI
            value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "opensampl.fullname" . }}-db:{{ .Values.db.port }}/{{ .Values.db.database }}
          {{- range $key, $value := .Values.migrations.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
        envFrom:
          - secretRef:
              name: {{ include "opensampl.fullname" . }}-db-secret
          - configMapRef:
              name: {{ include "opensampl.fullname" . }}-db-config
      restartPolicy: OnFailure
{{- end }}
