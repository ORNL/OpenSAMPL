[tox]
envlist = py311, py312, py313, py314, lint
isolated_build = True

[testenv]
package = wheel
extras = backend, collect, migrations
deps =
    pytest>=8.4
    pytest-cov
    pytest-mock>=3.17,<4
    pytest-postgresql
    psycopg[binary]
    mkdocs
    mkdocs-material>=9.7.7,<10
    pymdown-extensions>=11.0.1,<13
commands = pytest -v tests/

[testenv:lint]
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:format]
deps = ruff
commands =
    ruff check --fix .
    ruff format .
