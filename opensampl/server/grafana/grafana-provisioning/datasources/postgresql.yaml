apiVersion: 1

datasources:
  - name: ${POSTGRES_DB}-datasource
    type: grafana-postgresql-datasource
    url: ${OPENSAMPL_DATASOURCE_HOST}
    database: ${POSTGRES_DB}
    user: grafana
    secureJsonData:
      password: ${OPENSAMPL_DATASOURCE_PASSWORD}
    jsonData:
      sslmode: "disable"
      timescaledb: true
      searchPath: "castdb,public"