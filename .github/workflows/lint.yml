name: Lint with Ruff

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync project, including dev dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Check linting with Ruff
        run: uv run --no-sync ruff check .

      - name: Check formatting with Ruff
        run: uv run --no-sync ruff format --check .

      - name: Build static content
        run: |
          uv run --no-sync python ./scripts/gen_api_docs.py
          uv run --no-sync mkdocs build --clean
          test -s site/search/search_index.json
          test -n "$(find site/assets/javascripts -type f -name '*.js' -print -quit)"
