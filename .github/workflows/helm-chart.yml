name: Helm Chart CI/CD

# Pull requests only validate (build images locally, lint the chart, test-install it).
# Images and the Helm chart are published to GHCR only after a merge to main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: db
            context: ./opensampl/db
          - name: backend
            context: ./opensampl/backend
          - name: grafana
            context: ./opensampl/server/grafana

    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get package version
        id: version
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }} image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ghcr.io/ornl/opensampl-${{ matrix.service.name }}:latest
            ghcr.io/ornl/opensampl-${{ matrix.service.name }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Build ${{ matrix.service.name }} image (not pushed)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: ghcr.io/ornl/opensampl-${{ matrix.service.name }}:pr-local
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.service.name }}.tar
          cache-from: type=gha,scope=${{ matrix.service.name }}

      - name: Upload image for chart test
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service.name }}
          path: ${{ runner.temp }}/${{ matrix.service.name }}.tar
          retention-days: 1

  helm-validate:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint
        run: |
          helm lint ./helm
          helm lint ./helm -f ./helm/values-cluster-overrides.yaml

      - name: Render Helm Chart
        run: |
          helm template opensampl ./helm \
            -f ./helm/values-cluster-overrides.yaml \
            --namespace opensampl-test \
            > "$RUNNER_TEMP/opensampl-rendered.yaml"

      - name: Require chart version bump when chart changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          if ! git diff --quiet origin/main -- helm; then
            base="$(git show origin/main:helm/Chart.yaml | grep -m1 '^version:' | awk '{print $2}')"
            head="$(grep -m1 '^version:' helm/Chart.yaml | awk '{print $2}')"
            if [ "$base" = "$head" ]; then
              echo "::error file=helm/Chart.yaml::helm/ changed but chart version is still $head; bump it so the push to GHCR does not collide."
              exit 1
            fi
          fi

  test-helm-chart:
    name: Test Helm Chart Deployment
    runs-on: ubuntu-latest
    needs: build-docker-images
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start minikube
        uses: medyagh/setup-minikube@latest

      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Load images into minikube
        run: |
          for tar in "$RUNNER_TEMP"/images/*.tar; do
            minikube image load "$tar"
          done
          minikube image ls

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install Helm Chart
        working-directory: helm/
        run: |
          helm install test-opensampl . \
            --set global.imagePullPolicy=Never \
            --set db.image.tag=pr-local \
            --set backend.image.tag=pr-local \
            --set grafana.image.tag=pr-local \
            --set migrations.enabled=false \
            --set ingress.enabled=false \
            --wait \
            --timeout 15m

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get services
          kubectl get pvc

      - name: Show Pod Logs on Failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods
          echo "=== Pod Descriptions ==="
          kubectl describe pods
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -o name); do
            echo "Logs for $pod:"
            kubectl logs "$pod" --all-containers=true || true
          done

  helm-package:
    name: Package and Push Helm Chart
    runs-on: ubuntu-latest
    needs: [build-docker-images, helm-validate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package Chart
        run: helm package ./helm

      - name: Push to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io -u "$GITHUB_ACTOR" -p "$CR_PAT"
          helm push opensampl-*.tgz oci://ghcr.io/ornl/charts
