name: Testing with Pytest
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  uv-pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.21"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install PostgreSQL and PostGIS tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 postgresql-16-postgis-3 postgresql-16-postgis-3-scripts
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install the project
        run: uv sync --python ${{ matrix.python-version }} --locked --all-extras --all-groups

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -v

      - name: Verify CLI entry points and optional imports
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          uv run --python ${{ matrix.python-version }} opensampl --help
          uv run --python ${{ matrix.python-version }} opensampl-collect --help
          uv run --python ${{ matrix.python-version }} opensampl-server --help
          uv run --python ${{ matrix.python-version }} opensampl-server2 --help
          uv run --python ${{ matrix.python-version }} python -c "import alembic, anyio, fastapi, mako, opensampl.server.backend.main, urllib3"

      - name: Build wheel and source distribution
        run: uv build --python ${{ matrix.python-version }}
