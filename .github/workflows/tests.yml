name: Testing with Pytest
on:
  push:
    branches:
      - main
    paths:
      - "opensampl/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "opensampl/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  uv-pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.21"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install PostgreSQL and PostGIS tooling
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg

          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
             -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y postgresql-16 postgresql-client-16 postgresql-16-postgis-3 postgresql-16-postgis-3-scripts
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install the project
        run: uv sync --python ${{ matrix.python-version }} --locked --all-extras --all-groups

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -v

      - name: Verify CLI entry points and optional imports
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          uv run --python ${{ matrix.python-version }} opensampl --help
          uv run --python ${{ matrix.python-version }} opensampl-collect --help
          uv run --python ${{ matrix.python-version }} opensampl-server --help
          uv run --python ${{ matrix.python-version }} opensampl-server2 --help
          uv run --python ${{ matrix.python-version }} python -c "import alembic, anyio, fastapi, mako, opensampl.server.backend.main, urllib3"

      - name: Build wheel and source distribution
        run: uv build --python ${{ matrix.python-version }}
