name: Build images

# Reusable workflow: builds the opensampl wheel once, then builds every container image from it.
# push=false -> images are built but NOT published (exported as artifacts for the chart test).
# push=true  -> images are pushed to GHCR (caller must grant packages: write).
on:
  workflow_call:
    inputs:
      push:
        description: Push images to GHCR instead of exporting them as artifacts
        type: boolean
        default: false

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.21"

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Get package version
        id: version
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: opensampl-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  build-images:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: db
            context: ./opensampl/server/db
          - name: backend
            context: ./opensampl/server/backend
            target: prod
            wheel: true
          - name: grafana
            context: ./opensampl/server/grafana
          - name: migrations
            context: ./opensampl/server/migrations
            wheel: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download wheel
        if: matrix.service.wheel
        uses: actions/download-artifact@v4
        with:
          name: opensampl-wheel
          path: ${{ runner.temp }}/dist

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }} image
        if: inputs.push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          target: ${{ matrix.service.target }}
          build-contexts: ${{ matrix.service.wheel && format('wheel={0}/dist', runner.temp) || '' }}
          build-args: OPENSAMPL_VERSION=${{ needs.build-wheel.outputs.version }}
          push: true
          tags: |
            ghcr.io/ornl/opensampl-${{ matrix.service.name }}:latest
            ghcr.io/ornl/opensampl-${{ matrix.service.name }}:${{ needs.build-wheel.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Build ${{ matrix.service.name }} image (not pushed)
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          target: ${{ matrix.service.target }}
          build-contexts: ${{ matrix.service.wheel && format('wheel={0}/dist', runner.temp) || '' }}
          build-args: OPENSAMPL_VERSION=${{ needs.build-wheel.outputs.version }}
          push: false
          tags: ghcr.io/ornl/opensampl-${{ matrix.service.name }}:pr-local
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.service.name }}.tar
          cache-from: type=gha,scope=${{ matrix.service.name }}

      - name: Upload image for chart test
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service.name }}
          path: ${{ runner.temp }}/${{ matrix.service.name }}.tar
          retention-days: 1
