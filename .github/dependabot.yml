version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /
      - /opensampl/server/backend
      - /opensampl/server/grafana
      - /opensampl/server/migrations
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    groups:
      container-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
