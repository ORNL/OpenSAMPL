version: 2

# Security-only configuration.
#
# `open-pull-requests-limit: 0` turns off routine version-update PRs for an ecosystem while
# Dependabot *security* updates (PRs for dependencies with known advisories/CVEs) keep working.
# The `schedule` block is still required by the schema, but it only affects version updates.
# Prerequisite: "Dependabot security updates" must be enabled in the repository's
# Settings > Code security.
#
# The `security-updates` groups below batch advisory fixes for an ecosystem into a single PR.

updates:
  - package-ecosystem: uv
    directory: /
    target-branch: bugfix/dependabot
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: bugfix/dependabot
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /
      - /opensampl/server/backend
      - /opensampl/server/db
      - /opensampl/server/grafana
      - /opensampl/server/migrations
    target-branch: bugfix/dependabot
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      container-security:
        applies-to: security-updates
        patterns:
          - "*"
